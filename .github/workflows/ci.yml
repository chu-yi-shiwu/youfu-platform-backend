name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Release manifest
        run: npm run manifest

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: youfu-release-${{ github.sha }}
          path: |
            dist
            release-manifest.json
          retention-days: 30

      - name: C3 发布闸门（全量：SQL 扫描 + 迁移幂等 + vitest）
        run: npx tsx scripts/releaseGate.ts --force-vitest
